name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  quality:
    name: Typecheck and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run compile

      - name: Test
        run: npm test

  build-firefox:
    name: Build Firefox
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Firefox
        run: npm run build

      - name: Upload Firefox build output
        uses: actions/upload-artifact@v4
        with:
          name: firefox-mv3-build
          path: .output/firefox-mv3

  build-chrome:
    name: Build Chrome
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Chrome
        run: npm run build:chrome

      - name: Upload Chrome build output
        uses: actions/upload-artifact@v4
        with:
          name: chrome-mv3-build
          path: .output/chrome-mv3
